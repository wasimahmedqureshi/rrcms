<!DOCTYPE html>
<html>
<head>
  <title>AI Agent MPR Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial; margin: 20px; }
    .report { margin-bottom: 40px; }
  </style>
</head>
<body>
  <h1>AI Agent MPR Reports</h1>
  <div id="reports"></div>

  <script>
    async function loadReports() {
      const response = await fetch("YOUR_GOOGLE_SCRIPT_URL");
      const data = await response.json();

      for (const [sheetName, sheetData] of Object.entries(data)) {
        const headers = sheetData[0];
        const rows = sheetData.slice(1);

        const labels = rows.map(r => r[0]);
        const values = rows.map(r => r[1]);

        const container = document.createElement("div");
        container.className = "report";
        container.innerHTML = `<h2>${sheetName}</h2><canvas></canvas>`;
        document.getElementById("reports").appendChild(container);

        new Chart(container.querySelector("canvas"), {
          type: 'bar',
          data: {
            labels: labels,
            datasets: [{
              label: sheetName,
              data: values,
              backgroundColor: 'rgba(54, 162, 235, 0.6)'
            }]
          }
        });
      }
    }

    loadReports();
  </script>
</body>
</html>
